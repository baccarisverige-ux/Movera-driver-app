<!DOCTYPE html>
<html>
<head>
  <meta name="movera-google-map-id" content="DRIVER_GOOGLE_MAP_ID">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Movera Driver. On-trip cockpit for pickup, navigation, and delivery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Owner 2026-10-30 "Map under the strip": installed on the Home Screen
       the app draws under the status bar (black-translucent), like a native
       app; the screens move their top by env(safe-area-inset-top), which
       Dart reads from a probe element (lib/core/platform/safe_area_insets*)
       because Flutter web reports no viewPadding. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movera Driver">
  <meta name="theme-color" content="#252E3A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Movera Driver</title>
  <style>
    /* One coordinate space for drawing and for taps (owner "Map under the
       strip"): the page is exactly the screen, fixed at 0,0 and never
       scrolled, so the Flutter canvas, the pointer positions and the
       safe-area insets all start at the same top-left corner. The rider
       app's old bug (taps offset by the status bar's height in the
       Home-Screen app) came from drawing under the bar while the page
       could move under it; here nothing can scroll and the insets are paid
       back by the screens themselves. */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #252E3A;
    }
    /* iPhone 15 / iOS 17 check 2026-10-30: Safari zooms the page in (and
       keeps it zoomed) when a text field under 16px gets focus. Flutter's
       own hidden <input>/<textarea> (in flt-text-editing-host, and the
       screen reader's fields) take the font of the Flutter field, e.g. the
       13-15px phone and code fields. They are invisible (Flutter draws the
       text), so 16px changes nothing on screen and Safari never zooms.
       Pinch-zoom stays allowed (the viewport is not locked), for accessibility. */
    input, textarea, select { font-size: 16px !important; }
    /* Driver G3 live check: Google Maps' marker hit area is an <img> of
       maps.gstatic.com/mapfiles/transparent.png; when it does not load the
       browser draws a broken-image box next to the car. Its <div> still
       takes taps; only the image is hidden. */
    .gm-style img[src*="/mapfiles/transparent.png"] { visibility: hidden !important; }
    /* iPhone Home Screen app: WebKit reports a viewport one status bar
       shorter than the screen; the script after the viewport-fit one sets
       --movera-viewport-gap to the missing height (0 everywhere else) so the
       page, like the Flutter view, reaches the bottom of the screen. */
    html, body { height: calc(100% + var(--movera-viewport-gap, 0px)); }
  </style>
  <script>
    // Flutter web replaces <meta name="viewport"> with its own when it
    // starts, without viewport-fit=cover; without it env(safe-area-inset-*)
    // are all 0 and nothing can draw under the status bar. Put it back on
    // whichever viewport tag is there, now and after the engine's swap.
    (function () {
      function cover() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if (c.indexOf('viewport-fit=cover') < 0) {
            metas[i].setAttribute('content', (c ? c + ', ' : '') + 'viewport-fit=cover');
          }
        }
      }
      cover();
      new MutationObserver(cover).observe(document.head, { childList: true });
    })();
  </script>
  <script>
    // Owner 2026-10-31 (iPhone Home Screen app with a Dynamic Island): after
    // "Map under the strip" the app ended about one status bar (~59pt) above
    // the bottom of the screen, with a band of page background under the
    // bottom bar. iOS bug: in a Home Screen app with black-translucent +
    // viewport-fit=cover the page starts at the very top of the screen, but
    // the viewport WebKit reports (documentElement.clientHeight, innerHeight,
    // 100%, and possibly visualViewport.height) is the screen height MINUS
    // the status bar. Flutter web (3.47, full-page mode) sizes the app on
    // iOS from documentElement.clientHeight (engine
    // full_page_dimensions_provider.dart computePhysicalSize), so the whole
    // app came out short by that much.
    // Fix, iOS Home Screen app only (Safari tabs, Android and desktop are
    // untouched): the page's clientHeight reports the real screen height
    // (screen.height in portrait, screen.width in landscape), html/body grow
    // by the same gap (--movera-viewport-gap), and visualViewport.height is
    // corrected by its own measured gap, so the keyboard inset Flutter
    // computes (clientHeight - visualViewport.height while typing) stays the
    // keyboard's real height. Nothing moves the origin: drawing and taps
    // still start at 0,0. iPad Split View / Slide Over (window narrower than
    // the screen) is left alone.
    // Applied only when the missing height equals env(safe-area-inset-top)
    // (within 2px), i.e. the page really starts under the status bar.
    (function () {
      var nav = window.navigator;
      var platform = String(nav.platform || '');
      var lower = platform.toLowerCase();
      // Same test as the engine's iOS detection (browser_detection.dart).
      var ios = lower.indexOf('iphone') >= 0 || lower.indexOf('ipad') >= 0 ||
        lower.indexOf('ipod') >= 0 ||
        (platform.indexOf('Mac') === 0 && (nav.maxTouchPoints || 0) > 2);
      window.moveraViewportGap = 0;
      if (!ios || nav.standalone !== true) return;
      var root = document.documentElement;
      var heightOf = Object.getOwnPropertyDescriptor(Element.prototype, 'clientHeight');
      var widthOf = Object.getOwnPropertyDescriptor(Element.prototype, 'clientWidth');
      if (!heightOf || !heightOf.get || !widthOf || !widthOf.get) return;
      var MAX_GAP = 100; // a status bar is at most ~62pt
      // The gap is the status bar only when the page really starts under it
      // (black-translucent): then it equals env(safe-area-inset-top). An old
      // Home Screen icon saved with an opaque status bar starts below the
      // bar, so its short viewport is right and is left alone.
      var topProbe = null;
      function insetTop() {
        if (!topProbe) {
          topProbe = document.createElement('div');
          topProbe.setAttribute('aria-hidden', 'true');
          topProbe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'visibility:hidden;pointer-events:none;' +
            'padding-top:env(safe-area-inset-top, 0px)';
          root.appendChild(topProbe);
        }
        return parseFloat(getComputedStyle(topProbe).paddingTop) || 0;
      }

      function measure() {
        var w = widthOf.get.call(root);
        var h = heightOf.get.call(root);
        var a = screen.width, b = screen.height;
        var shortSide = Math.min(a, b), longSide = Math.max(a, b);
        var full = 0, portrait = true;
        if (Math.abs(w - shortSide) <= 1) {
          full = longSide;
        } else if (Math.abs(w - longSide) <= 1) {
          full = shortSide;
          portrait = false;
        }
        return { h: h, full: full, portrait: portrait, gap: gapTo(full, h) };
      }
      function gapTo(full, h) {
        var gap = full - h;
        if (!(full > 0 && gap >= 1 && gap <= MAX_GAP)) return 0;
        return Math.abs(gap - insetTop()) <= 2 ? gap : 0;
      }
      function publish(gap) {
        if (gap === window.moveraViewportGap) return;
        window.moveraViewportGap = gap;
        root.style.setProperty('--movera-viewport-gap', gap + 'px');
      }

      Object.defineProperty(root, 'clientHeight', {
        configurable: true,
        get: function () {
          var m = measure();
          publish(m.gap);
          return m.h + m.gap;
        }
      });

      var vv = window.visualViewport;
      var vvHeightOf = vv && Object.getOwnPropertyDescriptor(Object.getPrototypeOf(vv), 'height');
      if (vvHeightOf && vvHeightOf.get) {
        // visualViewport.height's own gap, measured while the keyboard is
        // closed (then it is at least the page height), per orientation.
        var vvGap = {};
        Object.defineProperty(vv, 'height', {
          configurable: true,
          get: function () {
            var raw = vvHeightOf.get.call(vv);
            var m = measure();
            if (!m.full) return raw;
            var key = m.portrait ? 'portrait' : 'landscape';
            if (raw >= m.h - 1) vvGap[key] = gapTo(m.full, raw);
            // Not measured yet: assume it is short like the page, which keeps
            // the keyboard inset exactly as it was before this fix.
            return raw + (key in vvGap ? vvGap[key] : m.gap);
          }
        });
      }

      function sample() {
        publish(measure().gap);
        if (vv) void vv.height;
      }
      sample();
      window.addEventListener('resize', sample);
      window.addEventListener('orientationchange', function () {
        sample();
        // iOS settles the size a moment after a rotation: publish the new
        // gap, then make Flutter measure again.
        setTimeout(function () {
          sample();
          try { window.dispatchEvent(new Event('resize')); } catch (_) {}
          try { if (vv) vv.dispatchEvent(new Event('resize')); } catch (_) {}
        }, 300);
      });
      if (vv) vv.addEventListener('resize', sample);
    })();
  </script>
  <link rel="manifest" href="manifest.json">

  <!-- Replaced with the newmap131189 repository secret during deployment.
       A browser key is always public: it must be restricted to this site's
       HTTP referrers and to the Maps JavaScript API (docs/PRIVACY_SECURITY.md).
       async: a slow or stalled Maps request must not hold up the app; the
       adapter below and the map widget wait for it (driver-r4-24). -->
  <script src="https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_API_KEY" async></script>
  <script src="driver_map_camera.js"></script>
  <!-- Contract v0.18.3 R7: push (settings come from the server at run time). -->
  <script src="movera_push.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
