<!DOCTYPE html>
<html>
<head>
  <meta name="movera-google-map-id" content="DRIVER_GOOGLE_MAP_ID">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Movera Driver. On-trip cockpit for pickup, navigation, and delivery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Movera Driver">
  <meta name="theme-color" content="#252E3A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Movera Driver</title>
  <link rel="manifest" href="manifest.json">

  <!-- Replaced with the newmap131189 repository secret during deployment.
       A browser key is always public: it must be restricted to this site's
       HTTP referrers and to the Maps JavaScript API (docs/PRIVACY_SECURITY.md).
       async: a slow or stalled Maps request must not hold up the app; the
       adapter below and the map widget wait for it (driver-r4-24). -->
  <script src="https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_API_KEY" async></script>
  <script src="driver_map_camera.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
