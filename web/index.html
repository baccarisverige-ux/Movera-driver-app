<!DOCTYPE html>
<html>
<head>
  <meta name="movera-google-map-id" content="DRIVER_GOOGLE_MAP_ID">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Movera Driver. On-trip cockpit for pickup, navigation, and delivery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Movera Driver">
  <meta name="theme-color" content="#252E3A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Movera Driver</title>
  <style>
    /* iPhone 15 / iOS 17 check 2026-10-30: Safari zooms the page in (and
       keeps it zoomed) when a text field under 16px gets focus. Flutter's
       own hidden <input>/<textarea> (in flt-text-editing-host, and the
       screen reader's fields) take the font of the Flutter field, e.g. the
       13-15px phone and code fields. They are invisible (Flutter draws the
       text), so 16px changes nothing on screen and Safari never zooms.
       Pinch-zoom stays allowed (the viewport is not locked), for accessibility. */
    input, textarea, select { font-size: 16px !important; }
    /* Driver G3 live check: Google Maps' marker hit area is an <img> of
       maps.gstatic.com/mapfiles/transparent.png; when it does not load the
       browser draws a broken-image box next to the car. Its <div> still
       takes taps; only the image is hidden. */
    .gm-style img[src*="/mapfiles/transparent.png"] { visibility: hidden !important; }
  </style>
  <style>
    /* Owner 2026-11-03 (LT-2): the same loading screen as the rider app,
       copied from movera-rider-app web/index.html. */
    /* Boot screen. Plain HTML and CSS so it paints in milliseconds, while the
       app bundle is still downloading and compiling. Without it the driver
       stares at an empty page for several seconds and assumes the app is
       broken rather than loading. Dart clears it on its first frame. */
    #movera-boot {
      /* absolute, not fixed: owner 2026-10-31 "Go back to before" keeps
         any fixed layer off this page; inset 0 still covers the screen. */
      position: absolute;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #eef1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      opacity: 1;
      transition: opacity 240ms ease-out;
    }
    #movera-boot.movera-boot-done {
      opacity: 0;
      pointer-events: none;
    }
    #movera-boot .movera-boot-mark {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #1d252c;
      text-transform: uppercase;
    }
    #movera-boot .movera-boot-track {
      width: 132px;
      height: 3px;
      border-radius: 999px;
      background: rgba(29, 37, 44, 0.12);
      overflow: hidden;
    }
    #movera-boot .movera-boot-fill {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #1d252c;
      animation: movera-boot-slide 1150ms ease-in-out infinite;
    }
    @keyframes movera-boot-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #movera-boot .movera-boot-fill { animation: none; width: 100%; }
      #movera-boot { transition: none; }
    }
  </style>
  <link rel="manifest" href="manifest.json">

  <!-- GOOGLE_MAPS_API_KEY is replaced with the newmap131189 repository secret
       during deployment. A browser key is always public: it must be
       restricted to this site's HTTP referrers and to the Maps JavaScript API
       (docs/PRIVACY_SECURITY.md).
       Owner 2026-11-03 (LT-4 "load on open"): Maps JavaScript is no longer
       loaded with the page; the first map on screen calls
       moveraLoadGoogleMaps() (lib/widgets/custom_google_map.dart), so the
       sign-in screen does not wait for it. async as before: the adapter
       below and the map widget wait for it (driver-r4-24). -->
  <script>
    window.moveraLoadGoogleMaps = function() {
      if (window.moveraGoogleMapsRequested) return;
      window.moveraGoogleMapsRequested = true;
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_API_KEY';
      script.async = true;
      document.head.appendChild(script);
    };
  </script>
  <script src="driver_map_camera.js"></script>
  <script>
    // Owner 2026-11-03 (LT-4 "load on open"): the google_sign_in web plugin
    // adds Google's sign-in script (about 100 kB) at every start, but the
    // web build never signs in with Google (the button says "Coming soon",
    // lib/core/auth/provider_token_source.dart). Hold that script back until
    // moveraLoadGoogleSignIn() asks for it.
    (function() {
      var head = document.head;
      var append = head.appendChild;
      var held = null;
      head.appendChild = function(node) {
        var src = node && node.tagName === 'SCRIPT' ? String(node.src || '') : '';
        if (held === null && src.indexOf('https://accounts.google.com/gsi/client') === 0) {
          held = node;
          return node;
        }
        return append.call(head, node);
      };
      window.moveraLoadGoogleSignIn = function() {
        if (held && !held.parentNode) append.call(head, held);
      };
    })();
  </script>
  <!-- Contract v0.18.3 R7: push (settings come from the server at run time). -->
  <script src="movera_push.js"></script>
</head>
<body>
  <div id="movera-boot" role="status" aria-live="polite" aria-label="Loading Movera Driver">
    <div class="movera-boot-mark">Movera</div>
    <div class="movera-boot-track"><span class="movera-boot-fill"></span></div>
  </div>
  <script>
    // Dart calls this from its first post-frame callback. The timer is only a
    // fallback: if the app fails to boot the driver should see whatever Flutter
    // did render (or the empty page and its own reload button) rather than a
    // loading screen that never ends.
    (function() {
      var cleared = false;
      function clear() {
        if (cleared) return;
        cleared = true;
        var boot = document.getElementById('movera-boot');
        if (!boot) return;
        boot.classList.add('movera-boot-done');
        setTimeout(function() {
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        }, 280);
      }
      window.moveraAppReady = clear;
      setTimeout(clear, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
