name: Android test APK (staging)

# Owner upgrade test (same design as the rider app): builds APK 1 from `old_ref` and
# APK 2 from `new_ref` in ONE run, both signed with the same throw-away test key
# (generated here, never stored). APK 2 has the higher version code, so it installs
# over APK 1 and keeps app data. If both refs are equal, only one APK is built.
on:
  workflow_dispatch:
    inputs:
      old_ref:
        description: Branch/commit for APK 1 (installed first)
        default: main
      new_ref:
        description: Branch/commit for APK 2 (installed over APK 1)
        default: main

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIVE_API: https://movera-server.onrender.com
      # android/app/build.gradle.kts reads GOOGLE_MAPS_API_KEY.
      GOOGLE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.ANDROID_MAPS_API_KEY }}
      MOVERA_TEST_NUMBERS: ${{ secrets.MOVERA_TEST_NUMBERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Make a throw-away test signing key
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/test-signing"
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/test-signing/test.jks" \
            -storepass "$pw" -keypass "$pw" -alias movera-test -keyalg RSA -keysize 2048 \
            -validity 30 -dname "CN=Movera owner test, O=Movera"
          {
            echo "MOVERA_UPLOAD_STORE_FILE=$RUNNER_TEMP/test-signing/test.jks"
            echo "MOVERA_UPLOAD_STORE_PASSWORD=$pw"
            echo "MOVERA_UPLOAD_KEY_ALIAS=movera-test"
            echo "MOVERA_UPLOAD_KEY_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - name: Build APK(s)
        env:
          OLD_REF: ${{ inputs.old_ref }}
          NEW_REF: ${{ inputs.new_ref }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            # Test-only build: the owner checks sign-in, not the map.
            echo '::warning::No Google Maps key secret: test build uses a placeholder, the map will be grey.'
            echo "GOOGLE_MAPS_API_KEY=TEST_BUILD_NO_MAP" >> "$GITHUB_ENV"
            export GOOGLE_MAPS_API_KEY=TEST_BUILD_NO_MAP
          fi
          mkdir -p out
          build() {
            ref="$1"; number="$2"; name="$3"
            git checkout -q --force "$ref" 2>/dev/null || git checkout -q --force "origin/$ref"
            flutter pub get
            app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
            # Same entry file and dart-defines as the live web deploy (deploy-pages.yml).
            flutter build apk --release \
              -t lib/main.dart \
              --build-number="$number" \
              --dart-define=MOVERA_AUTH_REQUIRED=true \
              --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
              --dart-define=MOVERA_APP_VERSION="$app_version" \
              --dart-define=MOVERA_TEST_NUMBERS="${MOVERA_TEST_NUMBERS:-}"
            cp build/app/outputs/flutter-apk/app-release.apk "out/$name"
          }
          if [ "$OLD_REF" = "$NEW_REF" ]; then
            build "$NEW_REF" 100001 "driver-test.apk"
          else
            build "$OLD_REF" 100000 "1-install-first-old.apk"
            build "$NEW_REF" 100001 "2-install-second-new.apk"
          fi
          ls -la out
      - name: Remove test key
        if: always()
        run: rm -rf "$RUNNER_TEMP/test-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-test-apks
          path: out/*.apk
          retention-days: 7
          if-no-files-found: error
