name: Android test APK (staging)

# Owner upgrade test (same design as the rider app): builds APK 1 from `old_ref` and
# APK 2 from `new_ref` in ONE run, both signed with the same throw-away test key
# (generated here, never stored). APK 2 has the higher version code, so it installs
# over APK 1 and keeps app data. If both refs are equal, only one APK is built.
on:
  workflow_dispatch:
    inputs:
      old_ref:
        description: Branch/commit for APK 1 (installed first)
        default: main
      new_ref:
        description: Branch/commit for APK 2 (installed over APK 1)
        default: main
      testlab_device:
        description: 'Firebase Test Lab: run a test of the newest APK on this real phone (empty = no Test Lab run). Example: model=oriole,version=33'
        default: ''
      testlab_test:
        description: 'Test Lab kind: robo (taps around, no sign-in) or staging-checks (signs in with one test driver from the MOVERA_TEST_NUMBERS secret and checks online, G24, G17, G27, offline)'
        type: choice
        options:
          - robo
          - staging-checks
        default: robo

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIVE_API: https://movera-server.onrender.com
      # android/app/build.gradle.kts reads GOOGLE_MAPS_API_KEY.
      GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY || secrets.MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
      # The owner's styled Movera map (Google Cloud Map ID), the same variable
      # the web deploy puts in web/index.html (deploy-pages.yml). The Map ID
      # must also allow Android in Google Cloud, or the APK shows Google's
      # default style.
      DRIVER_MAP_ID: ${{ vars.DRIVER_MAP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Make a throw-away test signing key
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/test-signing"
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/test-signing/test.jks" \
            -storepass "$pw" -keypass "$pw" -alias movera-test -keyalg RSA -keysize 2048 \
            -validity 30 -dname "CN=Movera owner test, O=Movera"
          {
            echo "MOVERA_UPLOAD_STORE_FILE=$RUNNER_TEMP/test-signing/test.jks"
            echo "MOVERA_UPLOAD_STORE_PASSWORD=$pw"
            echo "MOVERA_UPLOAD_KEY_ALIAS=movera-test"
            echo "MOVERA_UPLOAD_KEY_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - name: Build APK(s)
        env:
          OLD_REF: ${{ inputs.old_ref }}
          NEW_REF: ${{ inputs.new_ref }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            # Test-only build: the owner checks sign-in, not the map.
            echo '::warning::No Google Maps key secret: test build uses a placeholder, the map will be grey.'
            echo "GOOGLE_MAPS_API_KEY=TEST_BUILD_NO_MAP" >> "$GITHUB_ENV"
            export GOOGLE_MAPS_API_KEY=TEST_BUILD_NO_MAP
          fi
          if [ -z "${DRIVER_MAP_ID:-}" ]; then
            echo '::warning::No DRIVER_MAP_ID variable: the APK uses the in-app Movera style, not the cloud Map ID.'
          elif ! printf '%s' "$DRIVER_MAP_ID" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "::error::Invalid DRIVER_MAP_ID (letters and digits only)."
            exit 1
          fi
          mkdir -p out
          build() {
            ref="$1"; number="$2"; name="$3"
            git checkout -q --force "$ref" 2>/dev/null || git checkout -q --force "origin/$ref"
            flutter pub get
            # The Account screen's "Version x (build)" line reads MOVERA_APP_VERSION: give it the APK's real build number
            # (owner 2026-11-11: know which APK is installed).
            app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"; app_version="${app_version%%+*}+${GITHUB_RUN_NUMBER}"
            # Same entry file and dart-defines as the live web deploy (deploy-pages.yml).
            flutter build apk --release \
              -t lib/main.dart \
              --build-number="$number" \
              --dart-define=MOVERA_AUTH_REQUIRED=true \
              --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
              --dart-define=MOVERA_APP_VERSION="$app_version" \
              --dart-define=MOVERA_GOOGLE_MAP_ID="${DRIVER_MAP_ID:-}"
            cp build/app/outputs/flutter-apk/app-release.apk "out/$name"
          }
          if [ "$OLD_REF" = "$NEW_REF" ]; then
            build "$NEW_REF" 100001 "driver-test.apk"
          else
            build "$OLD_REF" 100000 "1-install-first-old.apk"
            build "$NEW_REF" 100001 "2-install-second-new.apk"
          fi
          ls -la out
      - name: Remove test key
        if: always()
        run: rm -rf "$RUNNER_TEMP/test-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-test-apks
          path: out/*.apk
          retention-days: 7
          if-no-files-found: error
      # Firebase Test Lab (owner 2026-11-12: free Spark plan, 5 real-phone runs a day).
      # Needs the repo secret FIREBASE_TESTLAB_KEY (service account with Firebase Test Lab Admin)
      # and the Cloud Testing + Cloud Tool Results APIs on the movera-200b2 project.
      - name: Test Lab login
        if: inputs.testlab_device != '' && inputs.testlab_test == 'robo'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TESTLAB_KEY }}
      - name: Set up gcloud
        if: inputs.testlab_device != '' && inputs.testlab_test == 'robo'
        uses: google-github-actions/setup-gcloud@v2
      - name: Robo test on a real phone (Firebase Test Lab)
        if: inputs.testlab_device != '' && inputs.testlab_test == 'robo'
        env:
          DEVICE: ${{ inputs.testlab_device }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DEVICE" | grep -Eq '^model=[A-Za-z0-9_.-]+,version=[0-9]+$'; then
            echo "::error::testlab_device must look like model=oriole,version=33"; exit 1
          fi
          apk="out/driver-test.apk"; [ -f "$apk" ] || apk="out/2-install-second-new.apk"
          gcloud firebase test android run --type robo --app "$apk" \
            --device "$DEVICE" --timeout 5m --results-history-name driver-robo \
            --format=json | tee testlab.json


  # Owner 2026-11-12 ("U need find problems! So whats the point of test"): the
  # Robo run could not sign in, so it proved nothing. This job runs the on-phone
  # checks of integration_test/staging_device_test.dart on one real Test Lab
  # phone against the staging server: sign in with ONE test driver, go online,
  # position sends taken (G24), SOS numbers = the zone's (G17), Home -> pages ->
  # Back without failed calls or re-reads (G27), go offline.
  # The test number and code are passed ONLY at run time (Test Lab
  # --environment-variables -> instrumentation arguments); nothing is built into
  # either APK (test/widget/a12_no_test_numbers_test.dart). One device, one run
  # (free quota: 5 a day), manual only.
  device-checks:
    if: inputs.testlab_device != '' && inputs.testlab_test == 'staging-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIVE_API: https://movera-server.onrender.com
      GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY || secrets.MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
      DRIVER_MAP_ID: ${{ vars.DRIVER_MAP_ID }}
      DEVICE: ${{ inputs.testlab_device }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.new_ref }}
      - name: Test driver for this run (from secrets, never built in)
        id: driver
        env:
          TL_NUMBERS: ${{ secrets.MOVERA_TEST_NUMBERS }}
          TL_CODE: ${{ secrets.MOVERA_TEST_SIGNIN_CODE }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DEVICE" | grep -Eq '^model=[A-Za-z0-9_.-]+,version=[0-9]+(,locale=[A-Za-z_]+)?(,orientation=(portrait|landscape))?$'; then
            echo "::error::testlab_device must look like model=oriole,version=33"; exit 1
          fi
          if [ -z "${TL_NUMBERS:-}" ]; then
            echo "::warning::NOT CHECKED: the MOVERA_TEST_NUMBERS secret is not set in this repo, so the device test cannot sign in. No Test Lab run was used."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d "$RUNNER_TEMP/tl"
          # One driver number (browser.SE.driver, else se.d38) in E.164 and the
          # staging sign-in code (secret MOVERA_TEST_SIGNIN_CODE, else the
          # contract's auth.testSignIn.code). Masked first; values only in
          # $RUNNER_TEMP/tl (mode 600), never printed.
          python3 -I - "$RUNNER_TEMP/tl" <<'PY'
          import json, os, sys
          out = sys.argv[1]
          raw = os.environ["TL_NUMBERS"].strip()
          # Tolerate how the value was pasted: a leading "NAME=", outer quotes, escaped quotes.
          if raw.startswith("MOVERA_TEST_NUMBERS="):
              raw = raw[len("MOVERA_TEST_NUMBERS="):].strip()
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in "'\"":
              raw = raw[1:-1].strip()
          if raw.startswith('{\\"') or raw.startswith('[\\"'):
              raw = raw.replace('\\"', '"')
          try:
              numbers = json.loads(raw)
          except ValueError as err:
              # Shape only, never a value: length and the kind of first/last character.
              kind = lambda c: "brace" if c in "{}[]" else ("quote" if c in "'\"" else ("letter" if c.isalpha() else ("digit" if c.isdigit() else "other")))
              print(f"::warning::secret length {len(raw)}, starts with a {kind(raw[:1] or ' ')}, ends with a {kind(raw[-1:] or ' ')}; JSON error at char {getattr(err, 'pos', '?')}")
              print("::error::the MOVERA_TEST_NUMBERS secret is not JSON (same value as the cloud environment variable)")
              sys.exit(1)
          raw = None
          for path in (("browser", "SE", "driver"), ("se", "d38")):
              value = numbers
              for key in path:
                  value = value.get(key) if isinstance(value, dict) else None
              if isinstance(value, str) and value.strip():
                  raw = value.strip().replace(" ", "")
                  break
          if raw is None:
              print("::error::the MOVERA_TEST_NUMBERS secret has no browser.SE.driver or se.d38 entry")
              sys.exit(1)
          if raw.startswith("+"):
              e164, national = raw, raw[3:]
          else:
              national = raw.lstrip("0")
              e164 = "+46" + national
          code = os.environ.get("TL_CODE", "").strip()
          if not code:
              with open("contracts/contract.json", encoding="utf-8") as fh:
                  code = str(json.load(fh)["auth"]["testSignIn"]["code"]).strip()
          secrets = [e164, national, "0" + national, "46" + national, code]
          for value in secrets:
              print("::add-mask::" + value)
          sys.stdout.flush()
          def write(name, text):
              fd = os.open(os.path.join(out, name), os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, "w") as fh:
                  fh.write(text)
          write("phone", e164)
          write("code", code)
          write("scrub", "\n".join(secrets) + "\n")
          print("test driver ready (number and code masked)")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.driver.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.driver.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Build the app (live staging, test entry) and the androidTest APK
        if: steps.driver.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            echo '::warning::No Google Maps key secret: the map will be grey (the checks do not need it).'
            export GOOGLE_MAPS_API_KEY=TEST_BUILD_NO_MAP
          fi
          if [ -n "${DRIVER_MAP_ID:-}" ] && ! printf '%s' "$DRIVER_MAP_ID" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "::error::Invalid DRIVER_MAP_ID (letters and digits only)."; exit 1
          fi
          flutter pub get --enforce-lockfile
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"; app_version="${app_version%%+*}+${GITHUB_RUN_NUMBER}"
          # Debug: Flutter's JUnit runner tests the debug variant. Same live
          # dart-defines as the test APK above; no test number in them.
          flutter build apk --debug \
            -t integration_test/staging_device_test.dart \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_APP_VERSION="$app_version" \
            --dart-define=MOVERA_GOOGLE_MAP_ID="${DRIVER_MAP_ID:-}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/app-debug.apk
          (cd android && ./gradlew app:assembleAndroidTest --no-daemon -q)
          cp build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/app-debug-androidTest.apk
          ls -la out
      - name: Wake the staging server (it sleeps when idle)
        if: steps.driver.outputs.ready == 'true'
        run: curl -sS -o /dev/null -w 'staging /healthz %{http_code}\n' -m 90 "$LIVE_API/healthz" || true
      - name: Test Lab login
        if: steps.driver.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TESTLAB_KEY }}
      - name: Set up gcloud
        if: steps.driver.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Device checks on a real phone (Firebase Test Lab)
        id: run
        if: steps.driver.outputs.ready == 'true'
        env:
          RESULTS_BUCKET: ${{ vars.TESTLAB_RESULTS_BUCKET }}
        run: |
          set -uo pipefail
          device="$DEVICE"
          case "$device" in *locale=*) ;; *) device="$device,locale=en_US" ;; esac
          case "$device" in *orientation=*) ;; *) device="$device,orientation=portrait" ;; esac
          dir="driver-device/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bucket_flag=()
          if [ -n "${RESULTS_BUCKET:-}" ]; then bucket_flag=(--results-bucket "$RESULTS_BUCKET"); fi
          phone="$(cat "$RUNNER_TEMP/tl/phone")"; code="$(cat "$RUNNER_TEMP/tl/code")"
          mkdir -p testlab-results
          # ^~^ = "~" separates the variables (gcloud topic escaping). They become
          # `am instrument -e` arguments, read by MainActivityTest at run time.
          gcloud firebase test android run --type instrumentation \
            --app out/app-debug.apk --test out/app-debug-androidTest.apk \
            --device "$device" --timeout 9m --no-record-video --no-performance-metrics \
            --results-history-name driver-device-checks --results-dir "$dir" "${bucket_flag[@]}" \
            --directories-to-pull /sdcard/Android/data/se.movera.driver/files/tl \
            --environment-variables "^~^movera_tl_phone=${phone}~movera_tl_code=${code}~movera_tl_shots=1" \
            --format=json > testlab-results/testlab.json 2> testlab-results/gcloud.txt
          rc=$?
          unset phone code
          echo "Test Lab exit code: $rc (0 = passed, 10 = a test failed, 15 = inconclusive)"
          bucket="${RESULTS_BUCKET:-}"
          if [ -z "$bucket" ]; then
            bucket="$(grep -oE 'storage/browser/[^/]+' testlab-results/gcloud.txt | head -1 | cut -d/ -f3 || true)"
          fi
          {
            echo "rc=$rc"
            echo "bucket=${bucket#gs://}"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"
      - name: Download the results (logcat, JUnit XML, screenshots)
        if: always() && steps.run.outputs.bucket != ''
        env:
          BUCKET: ${{ steps.run.outputs.bucket }}
          DIR: ${{ steps.run.outputs.dir }}
        run: |
          set -uo pipefail
          gsutil -m -q cp -r "gs://$BUCKET/$DIR" testlab-results/ || echo "::warning::results download failed"
          find testlab-results -type f | sed 's/^/  /' | head -80
      - name: Remove test number and code from the results, then summarise
        if: always() && steps.driver.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p testlab-results
          TL_SCRUB="$(cat "$RUNNER_TEMP/tl/scrub" 2>/dev/null || true)" python3 tool/testlab_summary.py scrub testlab-results
          python3 tool/testlab_summary.py summary testlab-results
      - name: Remove the test driver file
        if: always()
        run: rm -rf "$RUNNER_TEMP/tl"
      - uses: actions/upload-artifact@v4
        if: always() && steps.driver.outputs.ready == 'true'
        with:
          name: testlab-results
          path: testlab-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Result
        if: steps.driver.outputs.ready == 'true'
        env:
          RC: ${{ steps.run.outputs.rc }}
        run: |
          if [ "${RC:-1}" != "0" ]; then
            echo "::error::Device checks did not pass on Test Lab (exit ${RC:-none}); see the summary above and the testlab-results artifact."
            exit 1
          fi
          echo "Device checks passed on Test Lab."
