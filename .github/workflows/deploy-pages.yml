name: Deploy Drider to GitHub Pages

on:
  workflow_run:
    workflows:
      - Drider CI
    types:
      - completed
  workflow_dispatch:

# Only the deploy job gets pages/id-token write (driver-u1): the build job runs
# the checked-out tree's code and must not hold a token that can publish.
permissions:
  contents: read

concurrency:
  # PR-triggered Drider CI completion also starts this workflow (the deploy
  # job then skips). A shared "pages" group let these skipped runs cancel the
  # latest valid main deployment. Isolate event branches so only a newer
  # main-branch deployment can supersede the current main deployment.
  # Only a push to main in this repository joins the "main" group: a fork pull
  # request from a branch named main must not cancel a real deploy (driver-u1).
  group: pages-${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')) && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure Google Maps
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.newmap131189 }}
          DRIVER_MAP_ID: ${{ vars.DRIVER_MAP_ID }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "The newmap131189 repository secret is missing or empty."
            exit 1
          fi
          sed -i "s|GOOGLE_MAPS_API_KEY|$GOOGLE_MAPS_API_KEY|g" web/index.html
          python3 - <<'PYMAP'
          import os, pathlib, re
          value = os.environ.get('DRIVER_MAP_ID', '')
          if value and not re.fullmatch(r'[a-zA-Z0-9_-]+', value):
              raise SystemExit('Invalid DRIVER_MAP_ID')
          path = pathlib.Path('web/index.html')
          path.write_text(path.read_text().replace('DRIVER_GOOGLE_MAP_ID', value))
          PYMAP

      - name: Version map zoom/gesture adapter for browser cache
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          sha = os.environ.get('DEPLOY_SHA', '')
          if not re.fullmatch(r'[a-f0-9]{40}', sha):
              raise SystemExit('Invalid deployment commit SHA')
          index = pathlib.Path('web/index.html')
          content = index.read_text()
          source = 'src="driver_map_camera.js"'
          if content.count(source) != 1:
              raise SystemExit('Expected exactly one Google Maps adapter script')
          index.write_text(content.replace(source,
              f'src="driver_map_camera.js?v={sha}"'))
          PY

      # Owner Demo Q2 (2026-11-04, "Remove now"): the public demo site
      # (free-arrival demo define at the Pages root) is no longer built or
      # published; only the live driver app at /live/ is. The old workflow is
      # kept in the Rules repo (archive/demo/driver/.github/workflows/).
      - name: Build live Drider web
        env:
          LIVE_API: ${{ vars.MOVERA_LIVE_API_URL }}
        run: |
          case "$LIVE_API" in https://*) ;; *) echo "::error::MOVERA_LIVE_API_URL must start with https://"; exit 1 ;; esac
          # Contract v0.16.0: crash reports name the pubspec version.
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          # Owner 2026-11-04 (B9, "Yes, both apps"): --wasm builds main.dart.wasm
          # (skwasm) AND main.dart.js; flutter_bootstrap.js picks wasm where the
          # browser supports it and falls back to JS elsewhere (older Safari).
          flutter build web --release --wasm --base-href "/Movera-driver-app/live/" \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_APP_VERSION="$app_version"
          # B9: let the page open the API connection early (hint only).
          sed -i "s|  <!-- MOVERA_API_PRECONNECT -->|  <link rel=\"preconnect\" href=\"${LIVE_API%/}\" crossorigin>|" build/web/index.html

      # The site root (where the demo used to be) and unknown paths open the
      # live app.
      - name: Assemble the site
        run: |
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          cp -a build/web "$RUNNER_TEMP/site/live"
          for page in index.html 404.html; do
            printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=/Movera-driver-app/live/"><link rel="canonical" href="/Movera-driver-app/live/"><script>location.replace("/Movera-driver-app/live/")</script>' > "$RUNNER_TEMP/site/$page"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
