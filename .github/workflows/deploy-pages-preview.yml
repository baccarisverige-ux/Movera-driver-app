name: Deploy Drider Preview (test server only)

# Owner 2026-11-23 ("Want see is test first"): a look-only preview of this
# branch at /Movera-driver-app/preview/, built against the TEST server
# (MOVERA_LIVE_API_URL). GitHub Pages replaces the whole site on every deploy,
# so this run takes the EXACT site of the last successful "Deploy Drider to
# GitHub Pages" run (its github-pages artifact: /live/, /app/, index.html,
# 404.html, byte for byte) and only adds the preview/ folder. Nothing in
# /live/ or /app/ is rebuilt or changed. The next main deploy removes /preview/.
# Runs only on pushes to the preview branch; never on main.
on:
  push:
    branches: [claude/laund-rule-review-j04dj5-dprofile]

permissions:
  contents: read

concurrency:
  # The same group as deploy-pages.yml's main deploys; a newer main deploy cancels this one (safe).
  group: pages-main
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Take the current published site unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          busy="$(gh run list -R "$REPO" --workflow deploy-pages.yml --limit 5 --json status --jq '[.[]|select(.status!="completed")]|length')"
          if [ "$busy" != "0" ]; then echo "::error::A live deploy is running; try again after it."; exit 1; fi
          run_id="$(gh run list -R "$REPO" --workflow deploy-pages.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" || { echo "::error::No successful live deploy found."; exit 1; }
          echo "Base site: deploy run $run_id"
          rm -rf /tmp/base /tmp/site && mkdir -p /tmp/base /tmp/site
          gh run download "$run_id" -R "$REPO" -n github-pages -D /tmp/base
          tar -xf /tmp/base/artifact.tar -C /tmp/site
          test -f /tmp/site/live/index.html || { echo "::error::base site has no /live/"; exit 1; }
          rm -rf /tmp/site/preview
          ls -la /tmp/site

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Build the preview (test server)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.newmap131189 }}
          DRIVER_MAP_ID: ${{ vars.DRIVER_MAP_ID }}
          LIVE_API: ${{ vars.MOVERA_LIVE_API_URL }}
          PROD_API: ${{ vars.MOVERA_PROD_API_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          flutter pub get --enforce-lockfile
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "newmap131189 secret missing"; exit 1; }
          sed -i "s|GOOGLE_MAPS_API_KEY|$GOOGLE_MAPS_API_KEY|g" web/index.html
          python3 - <<'PY'
          import os, pathlib, re
          value = os.environ.get('DRIVER_MAP_ID', '')
          if value and not re.fullmatch(r'[a-zA-Z0-9_-]+', value):
              raise SystemExit('Invalid DRIVER_MAP_ID')
          sha = os.environ['DEPLOY_SHA']
          p = pathlib.Path('web/index.html')
          c = p.read_text().replace('DRIVER_GOOGLE_MAP_ID', value)
          if c.count('src="driver_map_camera.js"') != 1:
              raise SystemExit('Expected exactly one Google Maps adapter script')
          p.write_text(c.replace('src="driver_map_camera.js"', f'src="driver_map_camera.js?v={sha}"'))
          PY
          LIVE_API="$(printf '%s' "$LIVE_API" | tr -d '[:space:][:cntrl:]')"
          PROD_API="$(printf '%s' "$PROD_API" | tr -d '[:space:][:cntrl:]')"
          case "$LIVE_API" in https://*) ;; *) echo "::error::MOVERA_LIVE_API_URL must start with https://"; exit 1 ;; esac
          if [ -n "$PROD_API" ] && [ "${PROD_API%/}" = "${LIVE_API%/}" ]; then echo "::error::test and real server are the same"; exit 1; fi
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          flutter build web --release --wasm --base-href "/Movera-driver-app/preview/" \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_APP_VERSION="$app_version"
          sed -i "s|  <!-- MOVERA_API_PRECONNECT -->|  <link rel=\"preconnect\" href=\"${LIVE_API%/}\" crossorigin>|" build/web/index.html
          if [ -f build/web/delete-account.html ]; then
            LIVE_API="$LIVE_API" python3 -c 'import json, os; print("window.MOVERA_API_BASE_URL = %s;" % json.dumps(os.environ["LIVE_API"].rstrip("/")))' > build/web/delete-account-config.js
          fi
          cp -a build/web /tmp/site/preview

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
