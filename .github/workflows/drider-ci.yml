name: Drider CI

on:
  push:
    branches:
      - main
      - chore/drider-phase0-1-baseline
      - 'audit/phase-*'
  pull_request:
    branches:
      - main
      - 'audit/phase-*'

permissions:
  contents: read

concurrency:
  # One group per commit and event so a base-branch update cannot cancel
  # the head run and leave a red cancelled check on the pull request.
  group: drider-ci-${{ github.workflow }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Frontend release evidence contracts
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
          python3 tool/check_frontend_release.py docs/frontend-completion/09-release-candidate.json

      - name: Driver web camera gesture contracts
        run: node tool/verify_driver_map_web.cjs

      - name: Critical lifecycle
        run: flutter test integration_test/driver_lifecycle_test.dart -d flutter-tester

      - name: Build web
        run: flutter build web --release

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-verification-${{ github.sha }}
          path: |
            build/test-evidence/
            test/failures/
          if-no-files-found: ignore

  android-release:
    name: Android release signing and preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Production release fails closed without signing secrets
        run: |
          set +e
          flutter build apk --release > /tmp/movera-release.txt 2>&1
          code=$?
          set -e
          cat /tmp/movera-release.txt
          if [ "$code" -eq 0 ]; then
            echo "Production release must fail when upload signing secrets are absent."
            exit 1
          fi
          grep -q "Production Android release refuses debug signing" /tmp/movera-release.txt

      - name: Missing maps key fails a native release candidate
        run: |
          set +e
          MOVERA_ALLOW_DEBUG_SIGNED_PREVIEW=true MOVERA_REQUIRE_MAPS_KEY=true \
            flutter build apk --release > /tmp/movera-maps.txt 2>&1
          code=$?
          set -e
          cat /tmp/movera-maps.txt
          if [ "$code" -eq 0 ]; then
            echo "Native release must fail when GOOGLE_MAPS_API_KEY is required and absent."
            exit 1
          fi
          grep -q "Native release requires GOOGLE_MAPS_API_KEY" /tmp/movera-maps.txt

      - name: Explicit internal preview build
        run: MOVERA_ALLOW_DEBUG_SIGNED_PREVIEW=true flutter build apk --release

  ios-release-preflight:
    name: iOS release compile preflight
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Compile iOS release without codesign
        run: flutter build ios --release --no-codesign

      - name: Missing maps key fails an iOS release candidate
        run: |
          set +e
          MOVERA_REQUIRE_MAPS_KEY=true \
            flutter build ios --release --no-codesign > /tmp/movera-ios-maps.txt 2>&1
          code=$?
          set -e
          cat /tmp/movera-ios-maps.txt
          if [ "$code" -eq 0 ]; then
            echo "iOS release must fail when GOOGLE_MAPS_API_KEY is required and absent."
            exit 1
          fi
          grep -q "Native release requires GOOGLE_MAPS_API_KEY" /tmp/movera-ios-maps.txt
