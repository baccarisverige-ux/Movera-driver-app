name: Drider CI

on:
  push:
    branches:
      - main
      - chore/drider-phase0-1-baseline
      - 'audit/phase-*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'audit/phase-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one Flutter version CI, the deploy workflow and the format check use.
  FLUTTER_VERSION: 3.47.6

jobs:
  # CI cost cut (owner 2026-11-06): docs-only pull requests and drafts skip the
  # heavy jobs. paths-ignore is not used on pull_request here because the
  # required checks would then never report and the PR would wait forever; a
  # skipped job reports as passed, so branch protection still works.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          # Any file that is not *.md and not under docs/ counts as code.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$files"

  verify:
    name: Analyze, test and build web
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: File size ratchet (Rule 25)
        run: python3 tool/size_ratchet.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: ARBs match lib/l10n/parts (rule 25 split)
        run: python3 tool/l10n_parts.py --check

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage floor for lib/core
        # 91.8 % on main at the Phase 2 audit (baseline-2026-10.md section 5).
        run: python3 tool/check_coverage.py coverage/lcov.info lib/core/ 91.5

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Frontend release evidence contracts
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
          python3 tool/check_frontend_release.py docs/frontend-completion/09-release-candidate.json

      - name: Driver web camera gesture contracts
        run: node tool/verify_driver_map_web.cjs

      - name: Critical lifecycle
        run: flutter test integration_test/driver_lifecycle_test.dart -d flutter-tester

      - name: Build web
        run: flutter build web --release

      - name: Web size budget (audit Phase 7; baseline 5,631,828 B raw, 1,595,503 B gzip)
        run: python3 tool/check_web_budget.py build/web --main-raw 6200000 --main-gzip 1760000

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-verification-${{ github.sha }}
          path: |
            build/test-evidence/
            test/failures/
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      # The checked-out tree, not the history: the Maps key already in old
      # commits is tracked as audit finding 4 (rotate or restrict).
      - name: Gitleaks on the working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            dir /repo --redact --no-banner --exit-code 1

  live-web:
    name: Build live web (MOVERA_AUTH_REQUIRED=true)
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # The same flags as the deploy workflow's live build, so a live-only
      # compile break fails the pull request, not the deploy after merge.
      - name: Build live web
        env:
          LIVE_API: ${{ vars.MOVERA_LIVE_API_URL || 'https://movera-server.onrender.com' }}
        run: |
          # Contract v0.16.0: crash reports name the pubspec version.
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          flutter build web --release --wasm --base-href "/Movera-driver-app/live/" \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_APP_VERSION="$app_version"
          # B9: the wasm build keeps the JS fallback next to it.
          test -f build/web/main.dart.wasm
          test -f build/web/main.dart.js

  android-release:
    name: Android release signing and preview
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Production release fails closed without signing secrets
        run: |
          set +e
          flutter build apk --release > /tmp/movera-release.txt 2>&1
          code=$?
          set -e
          cat /tmp/movera-release.txt
          if [ "$code" -eq 0 ]; then
            echo "Production release must fail when upload signing secrets are absent."
            exit 1
          fi
          grep -q "Production Android release refuses debug signing" /tmp/movera-release.txt

      - name: Missing maps key fails a native release candidate
        run: |
          set +e
          MOVERA_ALLOW_DEBUG_SIGNED_PREVIEW=true MOVERA_REQUIRE_MAPS_KEY=true \
            flutter build apk --release > /tmp/movera-maps.txt 2>&1
          code=$?
          set -e
          cat /tmp/movera-maps.txt
          if [ "$code" -eq 0 ]; then
            echo "Native release must fail when GOOGLE_MAPS_API_KEY is required and absent."
            exit 1
          fi
          grep -q "Native release requires GOOGLE_MAPS_API_KEY" /tmp/movera-maps.txt

      - name: Explicit internal preview build
        env:
          # Same Map ID as the web deploy and the test APK (empty: no Map ID).
          DRIVER_MAP_ID: ${{ vars.DRIVER_MAP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${DRIVER_MAP_ID:-}" ] && ! printf '%s' "$DRIVER_MAP_ID" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "::error::Invalid DRIVER_MAP_ID (letters and digits only)."
            exit 1
          fi
          MOVERA_ALLOW_DEBUG_SIGNED_PREVIEW=true flutter build apk --release \
            --dart-define=MOVERA_GOOGLE_MAP_ID="${DRIVER_MAP_ID:-}"

  # The iOS release compile preflight (macOS, billed 10x) moved to
  # drider-ios.yml with the same job name (CI cost cut, owner 2026-11-06).

  # Step 45 (2026-11-09, plan U5 prep): one job that is always there and green
  # only when every job of this workflow passed or was skipped on purpose, so a
  # branch ruleset can require exactly one check name ("gate"). Same rule as the
  # rider app's gate: changes and secret-scan must always pass; the other jobs
  # may be skipped only on a draft or a docs-only change (CI cost cut, owner
  # 2026-11-06).
  gate:
    name: gate
    if: always()
    needs: [changes, verify, secret-scan, live-web, android-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed on this commit
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = {k: v["result"] for k, v in json.load(sys.stdin).items()}
          skip_all = os.environ["CODE"] != "true" or os.environ["DRAFT"] == "true"
          ok = bool(needs)
          for job, result in needs.items():
              if result == "success":
                  continue
              planned = result == "skipped" and job not in ("changes", "secret-scan") and skip_all
              print(job, result, "planned skip" if planned else "FAIL")
              ok = ok and planned
          sys.exit(0 if ok else 1)
          '
