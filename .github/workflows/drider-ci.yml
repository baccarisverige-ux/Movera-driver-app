name: Drider CI

on:
  push:
    branches:
      - main
      - chore/drider-phase0-1-baseline
      - 'audit/phase-*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'audit/phase-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one Flutter version CI, the deploy workflow and the format check use.
  FLUTTER_VERSION: 3.47.6

jobs:
  # CI cost cut (owner 2026-11-06): docs-only pull requests and drafts skip the
  # heavy jobs. paths-ignore is not used on pull_request here because the
  # required checks would then never report and the PR would wait forever; a
  # skipped job reports as passed, so branch protection still works.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          # Any file that is not *.md and not under docs/ counts as code.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$files"

  # B15 (faster CI): the old single "verify" job (18 min) is split into
  # parallel jobs; the suite runs in four shards. The job that keeps the
  # check name "Analyze, test and build web" joins the shard coverage, keeps
  # the lib/core floor and fails unless every part passed.
  static:
    name: Format, analyze and release contracts
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter version
        run: flutter --version

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: ARBs match lib/l10n/parts (rule 25 split)
        run: python3 tool/l10n_parts.py --check

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Frontend release evidence contracts
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
          python3 tool/check_frontend_release.py docs/frontend-completion/09-release-candidate.json

      - name: Driver web camera gesture contracts
        run: node tool/verify_driver_map_web.cjs

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test shard with coverage
        # Whole test files per shard (test-case sharding split setUpAll
        # groups and loaded every file in every shard).
        run: |
          mapfile -t files < <(find test -name '*_test.dart' | sort | awk -v n=4 -v i=${{ matrix.shard }} '(NR - 1) % n == i - 1')
          echo "${#files[@]} test files in this shard"
          flutter test --coverage "${files[@]}"

      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: driver-coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-verification-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            build/test-evidence/
            test/failures/
          if-no-files-found: ignore

  lifecycle-web:
    name: Critical lifecycle and web build
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Critical lifecycle
        run: flutter test integration_test/driver_lifecycle_test.dart -d flutter-tester

      - name: Build web
        run: flutter build web --release

      - name: Web size budget (audit Phase 7; baseline 5,631,828 B raw, 1,595,503 B gzip)
        run: python3 tool/check_web_budget.py build/web --main-raw 6200000 --main-gzip 1760000

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-verification-${{ github.sha }}-lifecycle
          path: |
            build/test-evidence/
            test/failures/
          if-no-files-found: ignore

  verify:
    name: Analyze, test and build web
    # Skipped (= passed) with the heavy jobs on docs-only PRs and drafts.
    if: always() && needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    needs: [changes, static, test, lifecycle-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Every part passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r and all(x=="success" for x in r) else 1)'

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: driver-coverage-shard-*
          path: shards

      - name: Join shard coverage
        run: |
          mkdir -p coverage
          python3 tool/merge_lcov.py coverage/lcov.info shards/*/lcov.info

      - name: Coverage floor for lib/core
        # 91.8 % on main at the Phase 2 audit (baseline-2026-10.md section 5).
        run: python3 tool/check_coverage.py coverage/lcov.info lib/core/ 91.5

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      # The checked-out tree, not the history: the Maps key already in old
      # commits is tracked as audit finding 4 (rotate or restrict).
      - name: Gitleaks on the working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            dir /repo --redact --no-banner --exit-code 1

  live-web:
    name: Build live web (MOVERA_AUTH_REQUIRED=true)
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # The same flags as the deploy workflow's live build, so a live-only
      # compile break fails the pull request, not the deploy after merge.
      - name: Build live web
        env:
          LIVE_API: ${{ vars.MOVERA_LIVE_API_URL || 'https://movera-server.onrender.com' }}
        run: |
          # Contract v0.16.0: crash reports name the pubspec version.
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          flutter build web --release --base-href "/Movera-driver-app/live/" \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_APP_VERSION="$app_version"

  android-release:
    name: Android release signing and preview
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Production release fails closed without signing secrets
        run: |
          set +e
          flutter build apk --release > /tmp/movera-release.txt 2>&1
          code=$?
          set -e
          cat /tmp/movera-release.txt
          if [ "$code" -eq 0 ]; then
            echo "Production release must fail when upload signing secrets are absent."
            exit 1
          fi
          grep -q "Production Android release refuses debug signing" /tmp/movera-release.txt

      - name: Missing maps key fails a native release candidate
        run: |
          set +e
          MOVERA_ALLOW_DEBUG_SIGNED_PREVIEW=true MOVERA_REQUIRE_MAPS_KEY=true \
            flutter build apk --release > /tmp/movera-maps.txt 2>&1
          code=$?
          set -e
          cat /tmp/movera-maps.txt
          if [ "$code" -eq 0 ]; then
            echo "Native release must fail when GOOGLE_MAPS_API_KEY is required and absent."
            exit 1
          fi
          grep -q "Native release requires GOOGLE_MAPS_API_KEY" /tmp/movera-maps.txt

      - name: Explicit internal preview build
        run: MOVERA_ALLOW_DEBUG_SIGNED_PREVIEW=true flutter build apk --release

  # The iOS release compile preflight (macOS, billed 10x) moved to
  # drider-ios.yml with the same job name (CI cost cut, owner 2026-11-06).

  # B15: was its own workflow "Contract copy"; same job id and check name.
  contract-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Fails when contracts/ differs from movera-contracts main at the version
      # it claims (or from its own CHECKSUMS). The message says how to sync.
      - run: bash tool/check_contract_copy.sh
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}
